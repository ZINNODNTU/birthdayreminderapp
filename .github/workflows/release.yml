name: Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Release tag (e.g. v2.0.0)'
        required: true
      dry_run:
        description: 'Build and verify without publishing'
        required: true
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  build:
    name: Build & Release
    if: github.event_name != 'push' || github.ref_name != 'v1.0.1'
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.release_tag || github.ref }}
          fetch-depth: 0

      - name: Verify checked-out release source
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            EXPECTED="$(git rev-list -n 1 "${{ github.event.inputs.release_tag }}")"
            ACTUAL="$(git rev-parse HEAD)"
            echo "Checked out HEAD: $ACTUAL"
            if [[ "$ACTUAL" != "$EXPECTED" ]]; then
              echo "::error::Checked out source does not match selected release tag."
              exit 1
            fi
          fi

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Flutter 3.47.1
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.1'
          channel: stable
          cache: true

      - name: Flutter clean
        run: flutter clean

      - name: Flutter pub get
        run: flutter pub get

      - name: Format check
        run: dart format --output=none --set-exit-if-changed lib test

      - name: Analyze
        if: github.event_name != 'workflow_dispatch'
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Analyze historical release
        if: github.event_name == 'workflow_dispatch'
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Tests
        run: flutter test --no-pub --coverage

      - name: Verify version consistency (tag ↔ pubspec)
        id: version_gate
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            RELEASE_TAG="${{ github.event.inputs.release_tag }}"
          else
            RELEASE_TAG="${GITHUB_REF#refs/tags/}"
          fi
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Malformed tag '$RELEASE_TAG'. Expected vX.Y.Z"
            exit 1
          fi
          PUB_VERSION=$(grep '^version:' pubspec.yaml | awk '{print $2}')
          if [[ ! "$PUB_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+\+[0-9]+$ ]]; then
            echo "::error::Malformed pubspec version '$PUB_VERSION'. Expected X.Y.Z+N"
            exit 1
          fi
          PUB_SEM="${PUB_VERSION%+*}"
          TAG_SEM="${RELEASE_TAG#v}"
          if [[ "$TAG_SEM" != "$PUB_SEM" ]]; then
            echo "::error::Tag ($TAG_SEM) does not match pubspec ($PUB_SEM)"
            exit 1
          fi
          echo "RELEASE_TAG=$RELEASE_TAG" >> $GITHUB_OUTPUT
          echo "TAG_SEM=$TAG_SEM" >> $GITHUB_OUTPUT
          echo "PUB_BUILD=${PUB_VERSION#*+}" >> $GITHUB_OUTPUT

      - name: Verify signing secrets present
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PW: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PW: ${{ secrets.ANDROID_KEY_PASSWORD }}
          EXPECTED_CERT_SHA: ${{ secrets.ANDROID_RELEASE_CERT_SHA256 }}
        run: |
          missing=""
          for v in KEYSTORE KEYSTORE_PW KEY_ALIAS KEY_PW EXPECTED_CERT_SHA; do
            if [[ -z "${!v}" ]]; then missing="$missing $v"; fi
          done
          if [[ -n "$missing" ]]; then
            echo "::error::Missing required signing secrets:$missing"
            exit 1
          fi
          LEGACY_DEBUG_SHA="BD24C39818B6F2D4060CDCF714E28DAEF94F245D28B1721A6F0677E7B73B0DA6"
          CONFIGURED_SHA=$(echo "$EXPECTED_CERT_SHA" | tr -d ':' | tr '[:lower:]' '[:upper:]')
          if [[ "$CONFIGURED_SHA" == "$LEGACY_DEBUG_SHA" ]]; then
            echo "::error::The legacy Android debug certificate is forbidden for stable production releases."
            exit 1
          fi
          echo "All signing secrets present; configured signer is not the legacy debug certificate."

      - name: Materialize keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 -d > android/release.keystore
          ls -l android/release.keystore

      - name: Create key.properties
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          cat > android/key.properties <<EOF
          storePassword=$ANDROID_KEYSTORE_PASSWORD
          keyPassword=$ANDROID_KEY_PASSWORD
          keyAlias=$ANDROID_KEY_ALIAS
          storeFile=release.keystore
          EOF

      - name: Build release APK
        run: flutter build apk --release --android-skip-build-dependency-validation

      - name: Verify APK version
        run: |
          APK="build/app/outputs/flutter-apk/app-release.apk"
          AAPT=$(find "$ANDROID_HOME/build-tools" -name aapt -type f | sort -V | tail -1)
          BADGING="$("$AAPT" dump badging "$APK")"
          VERSION_NAME="$(printf '%s\n' "$BADGING" | sed -n "s/^package:.*versionName='\([^']*\)'.*/\1/p")"
          VERSION_CODE="$(printf '%s\n' "$BADGING" | sed -n "s/^package:.*versionCode='\([^']*\)'.*/\1/p")"
          echo "APK versionName: $VERSION_NAME"
          echo "APK versionCode: $VERSION_CODE"
          if [[ "$VERSION_NAME" != "${{ steps.version_gate.outputs.TAG_SEM }}" || "$VERSION_CODE" != "${{ steps.version_gate.outputs.PUB_BUILD }}" ]]; then
            echo "::error::APK version does not match selected release."
            exit 1
          fi

      - name: Verify signer SHA256
        id: verify_signer
        env:
          ANDROID_RELEASE_CERT_SHA256: ${{ secrets.ANDROID_RELEASE_CERT_SHA256 }}
        shell: bash
        run: |
          APK="build/app/outputs/flutter-apk/app-release.apk"
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -1)
          if [[ -z "$APKSIGNER" ]]; then
            echo "::error::apksigner not found"
            exit 1
          fi
          CERT_OUTPUT="$("$APKSIGNER" verify --print-certs "$APK" 2>&1)"
          # apksigner output has two possible formats depending on version:
          #   "Signer #1 certificate SHA-256 digest: ABCD..."
          #   "V2 Signer: certificate SHA-256 digest: ABCD..." (lines wrapped)
          SIGNER_RAW="$(
            printf '%s\n' "$CERT_OUTPUT" |
              grep -oiE '(Signer #1|V2 Signer):?.*SHA-256[[:space:]]+digest:[[:space:]]*[0-9A-Fa-f:]+' |
              sed -nE 's/.*SHA-256[[:space:]]+digest:[[:space:]]*([0-9A-Fa-f:]+).*/\1/p' |
              tr -d '\n' |
              sed 's/[:[:space:]]//g' |
              head -c 64
          )"
          normalize_sha256() {
            printf '%s' "$1" |
              tr -d '[:space:]:' |
              tr '[:lower:]' '[:upper:]'
          }
          ACTUAL="$(normalize_sha256 "$SIGNER_RAW")"
          EXPECTED="$(normalize_sha256 "$ANDROID_RELEASE_CERT_SHA256")"
          LEGACY_DEBUG_SHA="BD:24:C3:98:18:B6:F2:D4:06:0C:DC:F7:14:E2:8D:AE:F9:4F:24:5D:28:B1:72:1A:6F:06:77:E7:B7:3B:0D:A6"
          LEGACY="$(normalize_sha256 "$LEGACY_DEBUG_SHA")"
          if [[ ! "$ACTUAL" =~ ^[0-9A-F]{64}$ ]]; then
            echo "::error::Unable to parse signer SHA256 from APK."
            echo "apksigner certificate output:"
            printf '%s\n' "$CERT_OUTPUT"
            exit 1
          fi
          if [[ ! "$EXPECTED" =~ ^[0-9A-F]{64}$ ]]; then
            echo "::error::ANDROID_RELEASE_CERT_SHA256 is missing or malformed."
            echo "Expected normalized fingerprint length: ${#EXPECTED}"
            exit 1
          fi
          echo "APK signer SHA256: $ACTUAL"
          echo "Expected SHA256 length: ${#EXPECTED}"
          if [[ "$ACTUAL" != "$EXPECTED" ]]; then
            echo "::error::APK signer does not match configured production certificate."
            echo "Actual signer: $ACTUAL"
            exit 1
          fi
          if [[ "$ACTUAL" == "$LEGACY" ]]; then
            echo "::error::Release APK is signed with forbidden legacy debug certificate."
            exit 1
          fi
          echo "Signer verified as configured permanent production certificate."

      - name: Rename and verify APK
        run: |
          PUB_VERSION=$(grep '^version:' pubspec.yaml | awk '{print $2}')
          PUB_SEM="${PUB_VERSION%+*}"
          SOURCE="build/app/outputs/flutter-apk/app-release.apk"
          TARGET="BirthdayReminder-v${PUB_SEM}.apk"
          test -s "$SOURCE" || { echo "::error::Release APK was not created."; exit 1; }
          cp "$SOURCE" "$TARGET"
          test -s "$TARGET" || { echo "::error::Renamed APK is missing or empty."; exit 1; }
          ls -lh "$TARGET"

      - name: Upload signed APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: BirthdayReminder-v${{ steps.version_gate.outputs.TAG_SEM }}
          path: BirthdayReminder-v${{ steps.version_gate.outputs.TAG_SEM }}.apk
          if-no-files-found: error

      - name: Calculate SHA256
        run: |
          PUB_SEM="${{ steps.version_gate.outputs.TAG_SEM }}"
          sha256sum "BirthdayReminder-v${PUB_SEM}.apk" > "BirthdayReminder-v${PUB_SEM}.apk.sha256"
          cat "BirthdayReminder-v${PUB_SEM}.apk.sha256"

      - name: Generate release metadata
        shell: pwsh
        run: |
          $version = '${{ steps.version_gate.outputs.TAG_SEM }}'
          $build = [int]'${{ steps.version_gate.outputs.PUB_BUILD }}'
          $apk = "BirthdayReminder-v$version.apk"
          if ($version -eq '2.0.0') {
            ./scripts/release/generate_release_metadata.ps1 `
              -Version $version -BuildNumber $build -ApkPath $apk `
              -MinimumSupportedVersion '1.0.1' -RequiresReinstall `
              -MigrationMessage 'Phiên bản 2.0.0 sử dụng chữ ký phát hành bảo mật mới. Hãy sao lưu toàn bộ dữ liệu ở phiên bản 1.0.1, giữ file sao lưu an toàn, sau đó cài đặt lại ứng dụng và khôi phục dữ liệu.'
          } else {
            $changes = if ($version -eq '2.1.0') {
              @('Cải thiện hiệu năng', 'Tối ưu cập nhật ứng dụng', 'Sửa lỗi')
            } else { @() }
            $minimumVersion = if ($version -eq '2.1.0') { '2.0.0' } else { '' }
            ./scripts/release/generate_release_metadata.ps1 `
              -Version $version -BuildNumber $build -ApkPath $apk `
              -MinimumSupportedVersion $minimumVersion -Changes $changes
          }
          Get-Content release-metadata.json

      - name: Generate structured release notes
        if: github.event_name != 'workflow_dispatch' || inputs.dry_run == false
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ steps.version_gate.outputs.RELEASE_TAG }}"
          VERSION="${{ steps.version_gate.outputs.TAG_SEM }}"
          PREVIOUS_TAG=$(git tag --sort=-version:refname | grep -Fxv "$TAG" | head -1 || true)
          RANGE="$TAG"
          if [[ -n "$PREVIOUS_TAG" ]]; then RANGE="$PREVIOUS_TAG..$TAG"; fi
          COMMITS=$(git log "$RANGE" --pretty='- %s' --no-merges || true)
          FEATURES=$(printf '%s\n' "$COMMITS" | grep -Ei '^- (feat|feature)(\(.+\))?:' || true)
          FIXES=$(printf '%s\n' "$COMMITS" | grep -Ei '^- (fix|bugfix)(\(.+\))?:' || true)
          BREAKING=$(printf '%s\n' "$COMMITS" | grep -Ei 'BREAKING CHANGE|^- .+!:' || true)
          {
            echo "## Version"
            echo "v$VERSION (build ${{ steps.version_gate.outputs.PUB_BUILD }})"
            echo
            echo "## Tính năng mới"
            [[ -n "$FEATURES" ]] && echo "$FEATURES" || echo "- Không có thay đổi được đánh dấu."
            echo
            echo "## Bug đã fix"
            [[ -n "$FIXES" ]] && echo "$FIXES" || echo "- Không có thay đổi được đánh dấu."
            echo
            echo "## Breaking changes"
            [[ -n "$BREAKING" ]] && echo "$BREAKING" || echo "- Không có."
            echo
            echo "## Thay đổi khác"
            [[ -n "$COMMITS" ]] && echo "$COMMITS" || echo "- Không có."
          } > release-notes.md

      - name: Create GitHub Release
        if: github.event_name != 'workflow_dispatch' || inputs.dry_run == false
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version_gate.outputs.RELEASE_TAG }}
          name: "Birthday Reminder ${{ steps.version_gate.outputs.TAG_SEM }}"
          body_path: RELEASE_NOTES_2.1.0.md
          files: |
            BirthdayReminder-v${{ steps.version_gate.outputs.TAG_SEM }}.apk
            BirthdayReminder-v${{ steps.version_gate.outputs.TAG_SEM }}.apk.sha256
            release-metadata.json
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
