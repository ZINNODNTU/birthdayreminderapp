name: birthdayreminderapp
description: "A new Flutter project."
publish_to: 'none'

version: 2.0.0+3

environment:
  sdk: ^3.7.2

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  firebase_core: ^3.8.0
  firebase_auth: ^5.3.3
  cloud_firestore: ^5.5.0
  intl: ^0.20.2
  uuid: ^4.2.2
  flutter_local_notifications: ^19.2.1
  timezone: ^0.10.1
  image_picker: ^1.0.4
  http: ^1.4.0
  mime: ^1.0.4
  http_parser: ^4.0.2
  provider: ^6.1.1
  table_calendar: ^3.2.0
  image: ^4.1.3
  permission_handler: ^12.0.0+1
  package_info_plus: ^8.3.0
  path_provider: ^2.1.5
  sqflite: ^2.4.2
  path: ^1.9.1
  flutter_contacts: ^2.3.1
  share_plus: ^11.0.0
  lunar: ^1.7.5
  google_fonts: ^8.0.0
  csv: ^6.0.0
  open_file: ^3.5.10
  device_info_plus: ^11.4.0
  shared_preferences: ^2.5.3
  flutter_timezone: ^4.1.1
  google_sign_in: ^7.2.0
  flutter_localizations:
    sdk: flutter
  flutter_secure_storage: ^10.3.1
  crypto: ^3.0.7
  archive: ^4.2.0
  file_picker: ^11.0.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  mocktail: ^1.0.0
  flutter_lints: ^5.0.0
  sqflite_common_ffi: ^2.3.4
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  assets:
    - assets/branding/app_icon.png

flutter_launcher_icons:
  image_path: assets/branding/app_icon.png
  adaptive_icon_background: '#192A56'
  adaptive_icon_foreground: assets/branding/app_icon_foreground.png
  android: true
  ios: false
